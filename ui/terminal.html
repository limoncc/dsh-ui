<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>dsh-ui 终端</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #1e1e20;
      }
      #term {
        flex: 1;
        min-height: 0;
        padding: 4px 8px 0;
        box-sizing: border-box;
      }
      #term .xterm {
        height: 100%;
      }
      /* 隐藏 xterm 滚动条（右下角白点来源） */
      .xterm-viewport::-webkit-scrollbar {
        display: none;
      }
      .xterm-viewport {
        scrollbar-width: none;
      }
      /* 顶部拖拽把手：上下拖动调整面板高度 */
      #drag-handle {
        height: 14px;
        flex: none;
        cursor: row-resize;
        background: rgba(255, 255, 255, 0.06);
      }
      #drag-handle:hover {
        background: rgba(10, 132, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="drag-handle" title="滚轮或拖动调整高度，双击恢复默认"></div>
    <div
      id="tstat"
      style="
        font: 10px ui-monospace, Menlo, monospace;
        color: #7ee787;
        background: rgba(0, 0, 0, 0.6);
        padding: 1px 8px;
        z-index: 99;
      "
    >
      stat: boot
    </div>
    <div id="term"></div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      const T = window.__TAURI_INTERNALS__;
      const invoke = (cmd, args) => T.invoke(cmd, args);

      let term = null;
      let fitAddon = null;

      function fitTerminal() {
        if (!fitAddon) return;
        try {
          fitAddon.fit();
        } catch (e) {}
      }

      function initTerminal() {
        if (term) return;
        term = new Terminal({
          fontFamily: 'Menlo, Monaco, monospace',
          fontSize: 12,
          cursorBlink: true,
          theme: {
            background: '#1e1e20',
            foreground: '#e8e8ea',
            cursor: '#e8e8ea',
            selectionBackground: 'rgba(10, 132, 255, 0.4)',
          },
          scrollback: 5000,
        });
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('term'));
        term.onData((data) => invoke('pty_write', { data }).catch(() => {}));
        term.onResize(({ rows, cols }) =>
          invoke('pty_resize', { rows, cols }).catch(() => {})
        );
        // 布局生效后再适配尺寸；窗口变化时同样重新 fit。
        requestAnimationFrame(fitTerminal);
        window.addEventListener('resize', fitTerminal);
      }

      function base64ToBytes(encoded) {
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      let cursor = 0;
      let shellAlive = true;
      let pulling = false;
      let pullCount = 0;
      const stat = (m) => {
        const el = document.getElementById('tstat');
        if (el) el.textContent = m;
      };
      document.getElementById('tstat').textContent = 'T=' + typeof window.__TAURI_INTERNALS__;

      async function pullOutput() {
        // 拉取无条件运行（webview 常驻 320 高、页面加载即初始化）；
        // 面板可见性由 Rust relayout/hide 控制，与此处解耦。
        if (!term || pulling) return;
        pulling = true;
        try {
          pullCount += 1;
          if (pullCount % 20 === 1) {
            stat('pull #' + pullCount + ' cursor=' + cursor + ' h=' + (term ? term.rows : '-'));
          }
          // 长轮询：Rust 侧最多等 150ms，有数据立即返回。
          const res = await invoke('pty_read', { cursor });
          if (res.data) term.write(base64ToBytes(res.data));
          cursor = res.cursor;
          if (!res.exited && !shellAlive) {
            shellAlive = true;
          } else if (res.exited && shellAlive) {
            shellAlive = false;
            term.writeln('\r\n\x1b[2m[shell 已退出，收起后再展开可重启]\x1b[0m');
          }
        } catch (e) {}
        pulling = false;
      }

      if (T) {
        // 页面加载即初始化终端（webview 常驻 320 高，无需等待展开）。
        initTerminal();
        // 输出拉取循环（可靠 IPC 通道，不走事件）。
        (async () => {
          for (;;) {
            await pullOutput();
            await new Promise((r) => setTimeout(r, 30));
          }
        })();
      }
    </script>
  </body>
</html>
