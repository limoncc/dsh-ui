<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>dsh-ui 终端</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: #1e1e20;
      }
      #term {
        height: 100%;
        padding: 4px 8px 0;
        box-sizing: border-box;
      }
      #term .xterm {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="term"></div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      const T = window.__TAURI_INTERNALS__;
      const invoke = (cmd, args) => T.invoke(cmd, args);

      let term = null;
      let fitAddon = null;

      function fitTerminal() {
        if (!fitAddon) return;
        try {
          fitAddon.fit();
        } catch (e) {}
      }

      function initTerminal() {
        if (term) return;
        term = new Terminal({
          fontFamily: 'Menlo, Monaco, monospace',
          fontSize: 12,
          cursorBlink: true,
          theme: {
            background: '#1e1e20',
            foreground: '#e8e8ea',
            cursor: '#e8e8ea',
            selectionBackground: 'rgba(10, 132, 255, 0.4)',
          },
          scrollback: 5000,
        });
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('term'));
        term.onData((data) => invoke('pty_write', { data }).catch(() => {}));
        term.onResize(({ rows, cols }) =>
          invoke('pty_resize', { rows, cols }).catch(() => {})
        );
        // 布局生效后再适配尺寸；窗口变化时同样重新 fit。
        requestAnimationFrame(fitTerminal);
        window.addEventListener('resize', fitTerminal);
      }

      function base64ToBytes(encoded) {
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      let cursor = 0;
      let shellAlive = true;
      let pulling = false;

      async function pullOutput() {
        // 面板收起时暂停拉取；展开后从上次游标继续（环形缓冲保留近期输出）。
        if (!term || pulling || !(await invoke('get_terminal_open').catch(() => false))) return;
        pulling = true;
        try {
          // 长轮询：Rust 侧最多等 150ms，有数据立即返回。
          const res = await invoke('pty_read', { cursor });
          if (res.data) term.write(base64ToBytes(res.data));
          cursor = res.cursor;
          if (!res.exited && !shellAlive) {
            shellAlive = true;
          } else if (res.exited && shellAlive) {
            shellAlive = false;
            term.writeln('\r\n\x1b[2m[shell 已退出，收起后再展开可重启]\x1b[0m');
          }
        } catch (e) {}
        pulling = false;
      }

      if (T) {
        // 输出拉取循环（可靠 IPC 通道，不走事件）。
        (async () => {
          for (;;) {
            await pullOutput();
            await new Promise((r) => setTimeout(r, 30));
          }
        })();
      }
    </script>
  </body>
</html>
