<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>正在启动</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e20;
          color: #f5f5f7;
        }
      }
      .box {
        text-align: center;
        max-width: 72vw;
      }
      .title {
        font-size: 17px;
        font-weight: 600;
      }
      .hint {
        font-size: 13px;
        opacity: 0.6;
        margin-top: 8px;
      }
      .error {
        font-size: 13px;
        color: #c0392b;
        margin-top: 16px;
        white-space: pre-wrap;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">正在启动 DeepSeek Harness…</div>
      <div class="hint" id="hint">首次启动可能需要较长时间</div>
      <div class="error" id="error"></div>
    </div>
    <script>
      const T = window.__TAURI__;
      if (T) {
        T.event.listen('dsh://state', (event) => {
          const state = event.payload;
          const errorEl = document.getElementById('error');
          const hintEl = document.getElementById('hint');
          if (state.status === 'ready') {
            errorEl.textContent = '';
          } else if (state.status === 'error' || state.status === 'stopped') {
            errorEl.textContent = state.error || 'dsh 已停止。';
            hintEl.textContent = '修复问题后，从底部状态条重启，或退出应用重新打开。';
          }
        });
        T.core.invoke('get_dsh_state').then((state) => {
          if (state.status === 'error' || state.status === 'stopped') {
            document.getElementById('error').textContent = state.error || '';
          }
        }).catch(() => {});
      }
    </script>
  </body>
</html>
