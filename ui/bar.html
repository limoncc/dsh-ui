<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>dsh-ui 状态条</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      body {
        --bg: #f5f5f7;
        --fg: #3a3a3c;
        --line: rgba(0, 0, 0, 0.15);
        --btn-bg: rgba(255, 255, 255, 0.6);
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        font-size: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      body.dark {
        --bg: #28282a;
        --fg: #d1d1d6;
        --line: rgba(255, 255, 255, 0.18);
        --btn-bg: rgba(255, 255, 255, 0.08);
      }
      /* 上半区：内嵌终端面板（收起时不占位） */
      #terminal-container {
        flex: 1;
        min-height: 0;
        padding: 4px 8px 0;
        display: none;
      }
      body.terminal-open #terminal-container {
        display: block;
      }
      #terminal-container .xterm {
        height: 100%;
      }
      /* 下沿：按钮条 */
      .bar-row {
        height: 36px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f39c12;
      }
      .dot.ready {
        background: #27ae60;
      }
      .dot.stopped,
      .dot.error {
        background: #c0392b;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      button {
        font-size: 12px;
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--fg);
        cursor: pointer;
      }
      button.active {
        border-color: #0a84ff;
        color: #0a84ff;
      }
    </style>
  </head>
  <body>
    <div id="terminal-container"></div>
    <div class="bar-row">
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="text">启动中…</span>
      </div>
      <div class="actions">
        <button id="restart" hidden title="重新启动 dsh 后端">重启</button>
        <button id="logs" title="在 Finder 中显示日志目录">日志</button>
        <button id="settings" title="配置 dsh / node 路径">设置</button>
        <button id="terminal" title="打开 / 收起内嵌终端">终端</button>
      </div>
    </div>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script>
      const T = window.__TAURI__;
      const LABELS = {
        starting: '启动中…',
        ready: '已连接',
        stopped: 'dsh 已停止',
        error: '启动失败',
      };
      function apply(state) {
        document.getElementById('dot').className = 'dot ' + state.status;
        document.getElementById('text').textContent = LABELS[state.status] || state.status;
        document.getElementById('restart').hidden =
          state.status === 'ready' || state.status === 'starting';
      }
      function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
        if (term) applyTerminalTheme(theme);
      }
      setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      // ---- 内嵌终端 ----
      const TERMINAL_THEMES = {
        light: {
          background: '#ffffff',
          foreground: '#1d1d1f',
          cursor: '#1d1d1f',
          selectionBackground: 'rgba(10, 132, 255, 0.3)',
        },
        dark: {
          background: '#1e1e20',
          foreground: '#e8e8ea',
          cursor: '#e8e8ea',
          selectionBackground: 'rgba(10, 132, 255, 0.4)',
        },
      };
      let term = null;
      let fitAddon = null;

      function currentThemeName() {
        return document.body.classList.contains('dark') ? 'dark' : 'light';
      }
      function applyTerminalTheme(themeName) {
        if (term) term.options.theme = TERMINAL_THEMES[themeName] || TERMINAL_THEMES.light;
      }

      function base64ToBytes(encoded) {
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function fitTerminal() {
        if (!fitAddon) return;
        try {
          fitAddon.fit();
        } catch (e) {}
      }

      function initTerminal() {
        if (term) return;
        term = new Terminal({
          fontFamily: 'Menlo, Monaco, monospace',
          fontSize: 12,
          cursorBlink: true,
          theme: TERMINAL_THEMES[currentThemeName()],
          scrollback: 5000,
        });
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        term.onData((data) => T.core.invoke('pty_write', { data }).catch(() => {}));
        term.onResize(({ rows, cols }) =>
          T.core.invoke('pty_resize', { rows, cols }).catch(() => {})
        );
        // 布局生效后再适配尺寸；窗口变化时同样重新 fit。
        requestAnimationFrame(fitTerminal);
        window.addEventListener('resize', fitTerminal);
      }

      if (T) {
        T.event.listen('dsh://state', (event) => apply(event.payload));
        T.event.listen('dsh://theme', (event) => setTheme(event.payload.theme));
        T.event.listen('pty://output', (event) => {
          if (term) term.write(base64ToBytes(event.payload));
        });
        T.event.listen('pty://exit', () => {
          if (term) term.writeln('\r\n\x1b[2m[shell 已退出]\x1b[0m');
        });
        T.core.invoke('get_dsh_state').then(apply).catch(() => {});
        document.getElementById('logs').addEventListener('click', () => {
          T.core.invoke('open_log_dir').catch(() => {});
        });
        document.getElementById('settings').addEventListener('click', () => {
          T.core.invoke('open_settings').catch(() => {});
        });
        document.getElementById('restart').addEventListener('click', () => {
          T.core.invoke('restart_dsh').catch(() => {});
        });
        document.getElementById('terminal').addEventListener('click', async () => {
          try {
            const open = await T.core.invoke('terminal_toggle');
            document.body.classList.toggle('terminal-open', open);
            document.getElementById('terminal').classList.toggle('active', open);
            if (open) {
              initTerminal();
              // 等 Rust 侧布局生效后再 fit 并聚焦。
              requestAnimationFrame(() => {
                fitTerminal();
                if (term) term.focus();
              });
            }
          } catch (e) {
            console.error('terminal_toggle failed', e);
          }
        });
      }
    </script>
  </body>
</html>
