<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>dsh-ui 状态条</title>
    <style>
      body {
        --bg: #f5f5f7;
        --fg: #3a3a3c;
        --line: rgba(0, 0, 0, 0.15);
        --btn-bg: rgba(255, 255, 255, 0.6);
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        font-size: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      body.dark {
        --bg: #28282a;
        --fg: #d1d1d6;
        --line: rgba(255, 255, 255, 0.18);
        --btn-bg: rgba(255, 255, 255, 0.08);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f39c12;
      }
      .dot.ready {
        background: #27ae60;
      }
      .dot.stopped,
      .dot.error {
        background: #c0392b;
      }
      button {
        font-size: 12px;
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--fg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="text">启动中…</span>
    </div>
    <div class="actions">
      <button id="restart" hidden title="重新启动 dsh 后端">重启</button>
      <button id="logs" title="在 Finder 中显示日志目录">日志</button>
      <button id="settings" title="配置 dsh / node 路径">设置</button>
      <button id="terminal" title="在窗口下方打开系统终端">终端</button>
    </div>
    <script>
      const T = window.__TAURI__;
      const LABELS = {
        starting: '启动中…',
        ready: '已连接',
        stopped: 'dsh 已停止',
        error: '启动失败',
      };
      function apply(state) {
        document.getElementById('dot').className = 'dot ' + state.status;
        document.getElementById('text').textContent = LABELS[state.status] || state.status;
        document.getElementById('restart').hidden =
          state.status === 'ready' || state.status === 'starting';
      }
      function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
      }
      setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (T) {
        T.event.listen('dsh://state', (event) => apply(event.payload));
        T.event.listen('dsh://theme', (event) => setTheme(event.payload.theme));
        T.core.invoke('get_dsh_state').then(apply).catch(() => {});
        document.getElementById('terminal').addEventListener('click', () => {
          T.core.invoke('open_terminal').catch(() => {});
        });
        document.getElementById('restart').addEventListener('click', () => {
          T.core.invoke('restart_dsh').catch(() => {});
        });
        document.getElementById('logs').addEventListener('click', () => {
          T.core.invoke('open_log_dir').catch(() => {});
        });
        document.getElementById('settings').addEventListener('click', () => {
          T.core.invoke('open_settings').catch(() => {});
        });
      }
    </script>
  </body>
</html>
