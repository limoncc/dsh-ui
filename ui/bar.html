<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>dsh-ui 状态条</title>
    <style>
      body {
        --bg: #f5f5f7;
        --fg: #3a3a3c;
        --line: rgba(0, 0, 0, 0.15);
        --btn-bg: rgba(255, 255, 255, 0.6);
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        font-size: 12px;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      body.dark {
        --bg: #28282a;
        --fg: #d1d1d6;
        --line: rgba(255, 255, 255, 0.18);
        --btn-bg: rgba(255, 255, 255, 0.08);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f39c12;
      }
      .dot.ready {
        background: #27ae60;
      }
      .dot.stopped,
      .dot.error {
        background: #c0392b;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      button {
        font-size: 12px;
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--fg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="text">启动中…</span>
    </div>
    <div class="actions">
      <button id="restart" hidden title="重新启动 dsh 后端">重启</button>
      <button id="logs" title="在 Finder 中显示日志目录">日志</button>
      <button id="settings" title="配置 dsh / node 路径">设置</button>
    </div>
    <script>
      // 与 chat-app 同款通信层：直接走 __TAURI_INTERNALS__（不依赖全局包）。
      const T = window.__TAURI_INTERNALS__;
      const invoke = (cmd, args) => T.invoke(cmd, args);

      const LABELS = {
        starting: '启动中…',
        ready: '已连接',
        stopped: 'dsh 已停止',
        error: '启动失败',
      };
      let lastStatus = '';

      function apply(state) {
        if (!state || state.status === lastStatus) return;
        lastStatus = state.status;
        document.getElementById('dot').className = 'dot ' + state.status;
        document.getElementById('text').textContent = LABELS[state.status] || state.status;
        document.getElementById('restart').hidden =
          state.status === 'ready' || state.status === 'starting';
      }
      function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
      }
      setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      if (T) {
        // 事件推送 + 定时轮询双通道（幂等），避免单一通道失灵导致状态卡死。
        if (typeof T.listen === 'function') {
          T.listen('dsh://state', (e) => apply(e.payload));
        }
        setInterval(async () => {
          try {
            apply(await invoke('get_dsh_state'));
          } catch (e) {}
        }, 800);
        setInterval(async () => {
          try {
            setTheme(await invoke('get_theme'));
          } catch (e) {}
        }, 1200);

        document.getElementById('logs').addEventListener('click', () => {
          invoke('open_log_dir').catch(() => {});
        });
        document.getElementById('settings').addEventListener('click', () => {
          invoke('open_settings').catch(() => {});
        });
        document.getElementById('restart').addEventListener('click', () => {
          invoke('restart_dsh').catch(() => {});
        });
      }
    </script>
  </body>
</html>
