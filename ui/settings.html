<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>dsh-ui 设置</title>
    <style>
      body {
        --fg: #1d1d1f;
        --sub: #6e6e73;
        --line: rgba(0, 0, 0, 0.12);
        --btn-bg: rgba(0, 0, 0, 0.05);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        background: #f5f5f7;
        color: var(--fg);
      }
      body.dark {
        --fg: #f5f5f7;
        --sub: #a1a1a6;
        --line: rgba(255, 255, 255, 0.16);
        --btn-bg: rgba(255, 255, 255, 0.08);
        background: #1e1e20;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .desc {
        font-size: 12px;
        color: var(--sub);
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      .hint {
        font-weight: 400;
        color: var(--sub);
        font-size: 12px;
        margin-left: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--fg);
        font-size: 13px;
        font-family: ui-monospace, Menlo, monospace;
      }
      input:focus {
        outline: 2px solid rgba(10, 132, 255, 0.5);
        outline-offset: -1px;
      }
      .actions {
        margin-top: 18px;
        display: flex;
        gap: 8px;
      }
      button {
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--btn-bg);
        color: var(--fg);
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #0a84ff;
        border-color: #0a84ff;
        color: #fff;
      }
      #result {
        margin-top: 14px;
        font-size: 12px;
        white-space: pre-wrap;
        line-height: 1.6;
        min-height: 20px;
      }
      #result.ok {
        color: #27ae60;
      }
      #result.err {
        color: #c0392b;
      }
    </style>
  </head>
  <body>
    <h1>dsh-ui 设置</h1>
    <div class="desc">自定义 dsh / node 的位置。留空则按 PATH 与常见目录自动探测，保存后立即生效。</div>

    <label>dsh 路径 <span class="hint">例如 /usr/local/bin/dsh，留空自动探测</span></label>
    <input id="dsh-path" placeholder="/usr/local/bin/dsh" spellcheck="false" />

    <label>node 路径 <span class="hint">需要 ≥22，留空自动探测</span></label>
    <input id="node-path" placeholder="/usr/local/bin/node" spellcheck="false" />

    <div class="actions">
      <button id="test">测试</button>
      <button id="save" class="primary">保存并重启 dsh</button>
    </div>
    <div id="result"></div>

    <script>
      const T = window.__TAURI_INTERNALS__;
      const invoke = (cmd, args) => T.invoke(cmd, args);
      const resultEl = document.getElementById('result');
      function setTheme(theme) {
        document.body.classList.toggle('dark', theme === 'dark');
      }
      setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      function readInputs() {
        return {
          dsh_path: document.getElementById('dsh-path').value.trim() || null,
          node_path: document.getElementById('node-path').value.trim() || null,
        };
      }

      if (T) {
        setInterval(async () => {
          try {
            setTheme(await invoke('get_theme'));
          } catch (e) {}
        }, 1200);
        T.invoke('get_config')
          .then((config) => {
            document.getElementById('dsh-path').value = config.dsh_path || '';
            document.getElementById('node-path').value = config.node_path || '';
          })
          .catch(() => {});

        document.getElementById('test').addEventListener('click', () => {
          const inputs = readInputs();
          resultEl.className = '';
          resultEl.textContent = '检测中…';
          invoke('test_environment', { dshPath: inputs.dsh_path, nodePath: inputs.node_path })
            .then((message) => {
              resultEl.className = 'ok';
              resultEl.textContent = message;
            })
            .catch((message) => {
              resultEl.className = 'err';
              resultEl.textContent = String(message);
            });
        });

        document.getElementById('save').addEventListener('click', () => {
          invoke('save_config', { config: readInputs() })
            .then(() => {
              resultEl.className = 'ok';
              resultEl.textContent = '已保存，dsh 正在以新配置重启…';
            })
            .catch((message) => {
              resultEl.className = 'err';
              resultEl.textContent = '保存失败：' + message;
            });
        });
      }
    </script>
  </body>
</html>
