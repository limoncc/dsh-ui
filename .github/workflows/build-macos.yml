name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: macos-arm64
          # - target: x86_64-apple-darwin
          #   os: macos-13
          #   artifact: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install

      - name: Build macOS app (${{ matrix.artifact }})
        run: npx tauri build

      - name: Ad-hoc sign and recreate DMG
        run: |
          APP="src-tauri/target/release/bundle/macos/dsh-ui.app"
          codesign --force --deep --sign - "$APP"
          hdiutil create \
            -volname "dsh-ui" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "dsh-ui_${{ matrix.artifact }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dsh-ui_${{ matrix.artifact }}.dmg

      # tag 构建（v*）：把 DMG 挂到 GitHub Release，Release 页直接下载。
      # Release 未创建时兜底创建（两 job 并发时吞掉 already_exists 失败）。
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "dsh-ui $GITHUB_REF_NAME" \
            || true
          gh release upload "$GITHUB_REF_NAME" "dsh-ui_${{ matrix.artifact }}.dmg" --clobber
